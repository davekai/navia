[package]
name = "navia-ffi"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "UniFFI bindings exposing Navia's core to Swift."

# Standalone so the Apple build doesn't pull in the GPUI workspace.
[workspace]

[lib]
name = "navia_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
navia-core = { path = "../navia-core", default-features = false }
navia-integrations = { path = "../navia-integrations" }
uniffi = { version = "=0.32.2", features = ["tokio"] }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = "0.3"

[features]
default = ["opus"]
# Native Opus needs libopus; Apple builds leave this off and fall back to a server transcode.
opus = ["navia-core/opus"]
bindgen = ["uniffi/cli"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
